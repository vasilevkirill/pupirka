name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.0'
        cache-dependency-path: go.sum

    - name: Download dependencies
      run: go mod download

    - name: Check module files
      run: go mod tidy -diff

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -race -v ./...

    - name: Vet
      run: go vet ./...
